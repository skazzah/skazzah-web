<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skazzah // dance mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #00ff88;
            animation: pulse 2s infinite;
        }

        .robot-container {
            position: relative;
            width: 300px;
            height: 400px;
            margin: 0 auto;
        }

        .robot {
            position: absolute;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            animation: bounce 0.6s infinite ease-in-out;
        }

        .head {
            width: 80px;
            height: 80px;
            background: #00ff88;
            border-radius: 10px;
            position: relative;
            margin: 0 auto 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: headBop 0.6s infinite ease-in-out;
        }

        .antenna {
            width: 4px;
            height: 20px;
            background: #00ff88;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .antenna-ball {
            width: 10px;
            height: 10px;
            background: #ffaa00;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: blink 1s infinite;
        }

        .eye {
            width: 15px;
            height: 15px;
            background: #0a0e27;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            animation: eyeMove 2s infinite;
        }

        .eye.left { left: 15px; }
        .eye.right { right: 15px; }

        .mouth {
            width: 30px;
            height: 15px;
            border: 3px solid #0a0e27;
            border-top: none;
            border-radius: 0 0 15px 15px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .body {
            width: 100px;
            height: 120px;
            background: #00ff88;
            border-radius: 15px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .panel {
            width: 60px;
            height: 80px;
            background: rgba(10, 14, 39, 0.3);
            border-radius: 8px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: lightSequence 1.2s infinite;
        }

        .light:nth-child(1) {
            background: #ff0088;
            animation-delay: 0s;
        }

        .light:nth-child(2) {
            background: #00ffff;
            animation-delay: 0.2s;
        }

        .light:nth-child(3) {
            background: #ffaa00;
            animation-delay: 0.4s;
        }

        .arm {
            width: 15px;
            height: 80px;
            background: #00ff88;
            border-radius: 8px;
            position: absolute;
            top: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .arm.left {
            left: -20px;
            transform-origin: top center;
            animation: armDanceLeft 0.6s infinite ease-in-out;
        }

        .arm.right {
            right: -20px;
            transform-origin: top center;
            animation: armDanceRight 0.6s infinite ease-in-out;
        }

        .hand {
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .legs {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 10px;
        }

        .leg {
            width: 20px;
            height: 60px;
            background: #00ff88;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            position: relative;
        }

        .leg.left {
            animation: legKickLeft 0.6s infinite ease-in-out;
        }

        .leg.right {
            animation: legKickRight 0.6s infinite ease-in-out;
        }

        .foot {
            width: 25px;
            height: 12px;
            background: #00ff88;
            border-radius: 0 0 8px 8px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .music-notes {
            position: absolute;
            font-size: 2rem;
            color: #00ffff;
            animation: float 2s infinite ease-in-out;
        }

        .note1 { top: 20%; left: 10%; animation-delay: 0s; }
        .note2 { top: 30%; right: 15%; animation-delay: 0.5s; }
        .note3 { top: 60%; left: 20%; animation-delay: 1s; }
        .note4 { top: 50%; right: 10%; animation-delay: 1.5s; }

        .back-link {
            margin-top: 3rem;
            color: #00ff88;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #00ff88;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #00ff88;
            color: #0a0e27;
            box-shadow: 0 0 20px #00ff88;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }

        @keyframes headBop {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes armDanceLeft {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(45deg); }
        }

        @keyframes armDanceRight {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(-45deg); }
        }

        @keyframes legKickLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        @keyframes legKickRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }

        @keyframes float {
            0%, 100% { 
                opacity: 0;
                transform: translateY(0) scale(1);
            }
            50% { 
                opacity: 1;
                transform: translateY(-50px) scale(1.2);
            }
        }

        @keyframes blink {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0; }
        }

        @keyframes lightSequence {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.2);
                box-shadow: 0 0 15px currentColor;
            }
        }

        @keyframes eyeMove {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(3px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            .robot-container {
                transform: scale(0.8);
            }
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="music-notes note1">♪</div>
    <div class="music-notes note2">♫</div>
    <div class="music-notes note3">♪</div>
    <div class="music-notes note4">♫</div>

    <div class="container">
        <div class="title">[ DANCE MODE ACTIVATED ]</div>
        
        <div class="robot-container">
            <div class="robot">
                <div class="head">
                    <div class="antenna">
                        <div class="antenna-ball"></div>
                    </div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>

                <div class="body">
                    <div class="arm left">
                        <div class="hand"></div>
                    </div>
                    <div class="arm right">
                        <div class="hand"></div>
                    </div>
                    <div class="panel">
                        <div class="light"></div>
                        <div class="light"></div>
                        <div class="light"></div>
                    </div>
                </div>

                <div class="legs">
                    <div class="leg left">
                        <div class="foot"></div>
                    </div>
                    <div class="leg right">
                        <div class="foot"></div>
                    </div>
                </div>
            </div>
        </div>

        <a href="index.html" class="back-link">← back to main</a>
    </div>
</body>
</html>
